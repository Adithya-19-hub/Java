<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <!-- first, last and only varient's in tailwind CSS -->
    <div>
        <h1 class="last:text-sky-500">Hello World</h1>
        <h1>Isolated</h1>
        <h1>Super</h1>
    </div>
    <div>
        <h4 class="only:text-red-700">Nothing</h4>
    </div>
    <form>
        <div>
            <input class="border-1 placeholder:text-green-500 uppercase focus:ring-purple-500" type="text" placeholder="Enter your name"/>
        </div>
        <input type="checkbox" class="checked:bg-red-600"/>
    </form>
    <button class="text-black border-[1px] rounded-md px-1 cursor-pointer bg-red-400 active:bg-red-600">Done</button>
    <div class="group border-[1px] h-[60px] rounded-md w-[140px]">
        <h2 class="group-hover:text-red-700">Heading</h2>
        <p class="group-hover:text-red-400">This is a horrible</p>
    </div>
</body>

</html>
