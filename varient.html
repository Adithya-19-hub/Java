<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <!-- first, last and only varient's in tailwind CSS -->
    <div>
        <h1 class="last:text-sky-500">Hello World</h1>
        <h1>Isolated</h1>
        <h1>Super</h1>
    </div>
    <div>
        <h4 class="only:text-red-700">Nothing</h4>
    </div>
</body>

</html>
